version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ateevibes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ateevibes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ateevibes_dev_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ateevibes_commerce}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ateevibes} -d ${POSTGRES_DB:-ateevibes_commerce}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
